# Single-page app: every path that is not a file (e.g. /s/<id>, /c/<code>) gets index.html.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

  # file names carry a content hash: cache them for good
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # the page itself must always be fresh, or a new version never arrives
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
