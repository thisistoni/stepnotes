# The website behind shared links: every path that is not a file (e.g. /s/<id>, /c/<code>) gets
# index.html, which opens the app or says where to get it.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

  # file names carry a content hash: cache them for good
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Apple reads this file to learn that /c/… and /s/… links open the app. It has no file
  # extension, so say that it is JSON.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "no-cache";
  }
  # the page itself must always be fresh, or a new version never arrives; "no-transform" also
  # stops Cloudflare from adding its analytics script to the page (the privacy text says no tracking)
  location / {
    add_header Cache-Control "no-cache, no-transform";
    try_files $uri /index.html;
  }
}
